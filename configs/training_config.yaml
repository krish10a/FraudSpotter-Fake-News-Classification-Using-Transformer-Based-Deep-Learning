# Training Configuration for FraudSpotter
seed: 42
device: "cuda"  # fallback to 'cpu' when cuda is unavailable

# Label Convention (Frozen canonical: REAL=0, FAKE=1)
labels:
  id2label:
    0: "REAL"
    1: "FAKE"
  label2id:
    "REAL": 0
    "FAKE": 1

transformer:
  model_name: "distilbert/distilbert-base-uncased"
  num_labels: 2
  max_seq_length: 256
  sequence_length_experiments: [128, 256, 384]
  batch_size: 16
  eval_batch_size: 32
  learning_rate: 2.0e-5
  weight_decay: 0.01
  num_train_epochs: 3
  warmup_ratio: 0.1
  lr_scheduler_type: "linear"
  fp16: true
  gradient_accumulation_steps: 1
  logging_steps: 100
  eval_steps: 500
  save_strategy: "epoch"
  evaluation_strategy: "epoch"
  load_best_model_at_end: true
  metric_for_best_model: "eval_f1_macro"
  output_dir: "artifacts/models/distilbert"

classical:
  # Memory efficiency & precision
  dtype: "float32"

  # Configurable text length handling to prevent memory spikes on extreme long texts
  text_length:
    max_chars: 8000
    enabled: true

  # Word TF-IDF representation (MultinomialNB & Logistic Regression)
  word_tfidf:
    ngram_range: [1, 2]
    min_df: 2
    max_df: 0.95
    sublinear_tf: true
    max_features: 100000

  # Character TF-IDF representation (Logistic Regression)
  char_tfidf:
    analyzer: "char_wb"
    ngram_range: [3, 5]
    min_df: 3
    max_df: 0.95
    sublinear_tf: true
    max_features: 50000

  # Majority Sanity Baseline
  majority:
    output_path: "artifacts/models/classical/majority_baseline.joblib"

  # Multinomial Naive Bayes (Word TF-IDF only)
  multinomial_nb:
    fit_prior: true
    alpha_candidates: [0.01, 0.05, 0.1, 0.5, 1.0, 2.0]
    output_path: "artifacts/models/classical/multinomial_nb.joblib"
    vectorizer_path: "artifacts/models/classical/multinomial_nb_vectorizer.joblib"

  # Logistic Regression - Word-only TF-IDF (Model C)
  logistic_word:
    penalty: "l2"
    solver: "lbfgs"
    solver_candidates: ["lbfgs", "liblinear"]
    max_iter: 2000
    class_weight: "balanced"
    C_candidates: [1.0, 2.0, 4.0]

  # Logistic Regression - Combined Word + Char TF-IDF (Model D)
  logistic_word_char:
    penalty: "l2"
    solver: "lbfgs"
    solver_candidates: ["lbfgs", "liblinear"]
    max_iter: 2000
    class_weight: "balanced"
    C_candidates: [1.0, 2.0, 4.0]

  # Legacy alias for backward compatibility
  logistic_regression:
    penalty: "l2"
    solver: "lbfgs"
    solver_candidates: ["lbfgs", "liblinear"]
    max_iter: 2000
    class_weight: "balanced"
    C_candidates: [1.0, 2.0, 4.0]

  # Linear SVM (Model E)
  linear_svm:
    loss: "squared_hinge"
    max_iter: 2000
    class_weight: "balanced"
    C_candidates: [0.5, 1.0, 2.0]
    use_calibration: false

optuna:
  n_trials: 10
  timeout_seconds: 7200
  search_space:
    learning_rate: [1.0e-5, 5.0e-5]
    batch_size: [16, 32]
    weight_decay: [0.001, 0.1]
    warmup_ratio: [0.05, 0.2]
