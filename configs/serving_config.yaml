# Serving and Deployment Configuration for FraudSpotter
server:
  host: "0.0.0.0"
  port: 8000
  reload: false
  workers: 1

optimization:
  onnx:
    model_path: "artifacts/models/distilbert_onnx/model.onnx"
    quantized_model_path: "artifacts/models/distilbert_onnx/model_quantized.onnx"
    quantization_type: "INT8"
    optimization_level: "ORT_ENABLE_ALL"
    execution_provider: "CPUExecutionProvider"
    max_seq_length: 512

fallback_model:
  type: "classical"
  path: "artifacts/models/classical/logreg.joblib"
  vectorizer_path: "artifacts/models/classical/tfidf_vectorizer.joblib"

frontend:
  title: "FraudSpotter - Explainable Fake News Detection"
  api_endpoint: "http://localhost:8000"
  max_input_characters: 10000

